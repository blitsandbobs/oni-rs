[package]
name = "oni"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.87"
description = "The Oni engine and game: plays the converted asset tree (simulation, AI, rendering, audio, UI, level scripts, scenario host)"

[dependencies]
oni-config = { path = "../oni-config" }
wgpu = "27"
winit = "0.30"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = "1"
serde_json = "1"
png = "0.17"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
oni-schema = { version = "0.0.1", path = "../oni-schema" }
cpal = "0.18.2"
oni-geom = { version = "0.0.1", path = "../oni-geom" }
oni-bink.workspace = true

[lints.rust]
unsafe_code = "forbid"
