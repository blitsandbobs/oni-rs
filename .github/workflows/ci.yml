# The commit gate's code half on every push (#28): the formatting
# (rustfmt's default style), clippy with warnings as errors, then the tests. The game's data (`generated/`, `original/`) is never
# in the repository, so the tests that need it skip; the Lua scenarios (which
# need it and a level) stay with `scripts/check.sh`, run locally.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # (cpal: ALSA's headers to build against.)
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
