[workspace]
resolver = "2"
members = [
    "crates/oni-fourcc",
    "crates/oni-bink",
    "crates/oni-bytes",
    "crates/oni-dat",
    "crates/oni-texture",
    "crates/oni-sound",
    "crates/oni-template",
    "crates/oni-template-gen",
    "crates/oni-geom",
    "crates/oni-config",
    "crates/oni-schema",
    "crates/oni-convert",
    "crates/oni",
]

# Tests are optimised (the mission tests simulate every level, minutes in a
# plain debug build) but keep debug assertions and overflow checks.
[profile.test]
opt-level = 2

# Release with debug info, for profiling (`xctrace` / Instruments).
[profile.profiling]
inherits = "release"
debug = true

# Release speed with the checks a debug build makes: integer overflow and
# debug assertions panic (scripting/shakedown.sh runs on it).
[profile.checked]
inherits = "release"
overflow-checks = true
debug-assertions = true

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "local"
rust-version = "1.74"

# A ground-up, portable Rust reimplementation of Oni's data formats,
# validated against OniSplit. See README.md.
[workspace.dependencies]
oni-fourcc = { path = "crates/oni-fourcc" }
oni-bink = { path = "crates/oni-bink" }
oni-bytes = { path = "crates/oni-bytes" }
oni-dat = { path = "crates/oni-dat" }

[workspace.lints.clippy]
too_many_lines = "warn"        # pedantic; threshold in clippy.toml
too_many_arguments = "warn"    # also catches the "split into 12-param helpers" gaming
cognitive_complexity = "warn"  # nursery; noisier, optional